name: Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test and build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Configure production signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD in repository Actions secrets}"
          : "${ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS in repository Actions secrets}"
          : "${ANDROID_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD in repository Actions secrets}"
          keystore="$RUNNER_TEMP/kedai-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties

      - name: Configure ephemeral signing key for CI builds
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kedai-ci.jks"
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" -storepass "$password" -keypass "$password" \
            -alias ci-upload -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Kedai POS CI, OU=Build, O=Kedai POS, C=ID"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=ci-upload\nkeyPassword=%s\n' \
            "$keystore" "$password" "$password" > android/key.properties

      - name: Build Android release APK
        run: >-
          flutter build apk --release --obfuscate
          --split-debug-info=build/symbols
          --build-number="$GITHUB_RUN_NUMBER"

      - name: Verify APK signature and create checksum
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          (
            cd "$(dirname "$apk")"
            sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"
          )
          tar -czf build/app-release-symbols.tar.gz -C build/symbols .

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kedai-pos-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kedai-pos-symbols-${{ github.run_number }}
          path: build/app-release-symbols.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish signed APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kedai-pos-apk-${{ github.run_number }}
          path: release/apk

      - name: Download obfuscation symbols
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kedai-pos-symbols-${{ github.run_number }}
          path: release/symbols

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/apk/app-release.apk
            release/apk/app-release.apk.sha256
            release/symbols/app-release-symbols.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
